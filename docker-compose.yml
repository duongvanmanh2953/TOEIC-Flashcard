services:
  postgres:
    image: postgres:16-alpine
    container_name: vocabflow-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-leximind_db}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - vocalflow-network

  redis:
    image: redis:7-alpine
    container_name: vocabflow-redis
    restart: always
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - vocalflow-network

  assets:
    build:
      context: .
      dockerfile: services/assets/Dockerfile
    container_name: vocabflow-assets
    restart: always
    ports:
      - '3300:80'
    volumes:
      - ./assets:/usr/share/nginx/html/assets:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - vocalflow-network

  app-api:
    build:
      context: .
      dockerfile: services/app-api/Dockerfile
    container_name: vocabflow-app-api
    restart: always
    env_file:
      - .env
    environment:
      PORT: 4000
      APP_URL: ${STUDENT_API_URL:-https://app-api.vocalflow.site}
      CLIENT_URL: ${STUDENT_CLIENT_URL:-https://app.vocalflow.site}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgrespassword@postgres:5432/leximind_db?schema=public}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      REDIS_KEY_PREFIX: "app:"
      ASSETS_BASE_URL: ${ASSETS_URL:-https://assets.vocalflow.site}
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vocalflow-network

  kid-api:
    build:
      context: .
      dockerfile: services/kid-api/Dockerfile
    container_name: vocabflow-kid-api
    restart: always
    env_file:
      - .env
    environment:
      PORT: 4100
      APP_URL: ${KID_API_URL:-https://kid-api.vocalflow.site}
      CLIENT_URL: ${KID_CLIENT_URL:-https://kid.vocalflow.site}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgrespassword@postgres:5432/leximind_db?schema=public}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      REDIS_KEY_PREFIX: "kid:"
      ASSETS_BASE_URL: ${ASSETS_URL:-https://assets.vocalflow.site}
    ports:
      - '4100:4100'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      app-api:
        condition: service_started
    networks:
      - vocalflow-network

  admin-api:
    build:
      context: .
      dockerfile: services/admin-api/Dockerfile
    container_name: vocabflow-admin-api
    restart: always
    env_file:
      - .env
    environment:
      PORT: 4200
      APP_URL: ${ADMIN_API_URL:-https://admin-api.vocalflow.site}
      CLIENT_URL: ${ADMIN_CLIENT_URL:-https://admin.vocalflow.site}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgrespassword@postgres:5432/leximind_db?schema=public}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      REDIS_KEY_PREFIX: "admin:"
      ASSETS_BASE_URL: ${ASSETS_URL:-https://assets.vocalflow.site}
    ports:
      - '4200:4200'
    volumes:
      - ./assets:/usr/share/nginx/html/assets
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      app-api:
        condition: service_started
    networks:
      - vocalflow-network

  student:
    build:
      context: .
      dockerfile: apps/student/Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_STUDENT_API_BASE_URL:-https://app-api.vocalflow.site/api}
        - VITE_ASSETS_BASE_URL=${VITE_ASSETS_BASE_URL:-https://assets.vocalflow.site}
        - VITE_FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY:-}
        - VITE_FIREBASE_AUTH_DOMAIN=${VITE_FIREBASE_AUTH_DOMAIN:-}
        - VITE_FIREBASE_PROJECT_ID=${VITE_FIREBASE_PROJECT_ID:-}
        - VITE_FIREBASE_STORAGE_BUCKET=${VITE_FIREBASE_STORAGE_BUCKET:-}
        - VITE_FIREBASE_MESSAGING_SENDER_ID=${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        - VITE_FIREBASE_APP_ID=${VITE_FIREBASE_APP_ID:-}
        - VITE_FIREBASE_MEASUREMENT_ID=${VITE_FIREBASE_MEASUREMENT_ID:-}
    container_name: vocabflow-student
    restart: always
    ports:
      - '3000:80'
    depends_on:
      - app-api
    networks:
      - vocalflow-network

  kid:
    build:
      context: .
      dockerfile: apps/kid/Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_KID_API_BASE_URL:-https://kid-api.vocalflow.site/api}
        - VITE_ASSETS_BASE_URL=${VITE_ASSETS_BASE_URL:-https://assets.vocalflow.site}
    container_name: vocabflow-kid
    restart: always
    ports:
      - '3100:80'
    depends_on:
      - kid-api
    networks:
      - vocalflow-network

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_ADMIN_API_BASE_URL:-https://admin-api.vocalflow.site/api}
        - VITE_ASSETS_BASE_URL=${VITE_ASSETS_BASE_URL:-https://assets.vocalflow.site}
    container_name: vocabflow-admin
    restart: always
    ports:
      - '3200:80'
    depends_on:
      - admin-api
    networks:
      - vocalflow-network

  landing:
    build:
      context: .
      dockerfile: apps/landing/Dockerfile
    container_name: vocabflow-landing
    restart: always
    ports:
      - '3080:80'
    networks:
      - vocalflow-network

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: always
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-eyJhIjoiODZjYmRiMDBlMGUxMTY4ZmUxOGYzMGE3ODIzOTlkNjUiLCJ0IjoiNzRiMDZkYjAtODRjMS00ZGNhLWI5NTAtYTk1NTBkOGM0MTBmIiwicyI6Ik0yWmxaV0ZoTjJVdE9HVmtOeTAwTkROaUxUazFOakF0T1RnNU5qRm1NMlF3Tm1WayJ9}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./infra/cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - ./infra/cloudflared/credentials.json:/etc/cloudflared/credentials.json:ro
      - ./infra/cloudflared/74b06db0-84c1-4dca-b950-a9550d8c410f.json:/etc/cloudflared/74b06db0-84c1-4dca-b950-a9550d8c410f.json:ro
    depends_on:
      - landing
      - student
      - kid
      - admin
      - app-api
      - kid-api
      - admin-api
      - assets
    networks:
      - vocalflow-network


volumes:
  postgres_data:
  redis_data:

networks:
  vocalflow-network:
    name: vocalflow-network
    driver: bridge
