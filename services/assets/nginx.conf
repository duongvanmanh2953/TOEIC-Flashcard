server {
    listen 80;
    server_name assets.vocalflow.site localhost;
    root /usr/share/nginx/html/assets;

    # Strip optional /assets/ prefix globally
    rewrite ^/assets/(.*)$ /$1;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Gzip compression for json, svg, fonts
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # CORS Headers for static assets
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, HEAD, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Range, Content-Type, Accept, Origin, Authorization' always;
    add_header 'Access-Control-Expose-Headers' 'Content-Length, Content-Range, Accept-Ranges' always;

    # Health check endpoint
    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","service":"vocabflow-assets","timestamp":"$time_iso8601"}';
    }

    # Handle OPTIONS preflight
    if ($request_method = 'OPTIONS') {
        return 204;
    }

    # Manifests and JSON metadata
    location ~* \.json$ {
        expires 5m;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        add_header 'Access-Control-Allow-Origin' '*' always;
        try_files $uri =404;
    }

    # Images, Audio, WebP, Fonts - Immutable long-term caching
    location ~* \.(webp|png|jpg|jpeg|gif|svg|ico|mp3|ogg|wav|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length, Content-Range, Accept-Ranges' always;
        try_files $uri =404;
    }

    # Root and directory status check
    location = / {
        default_type application/json;
        return 200 '{"status":"UP","service":"vocabflow-assets"}';
    }

    location = /assets/ {
        default_type application/json;
        return 200 '{"status":"UP","service":"vocabflow-assets"}';
    }

    # General static file fallback (never 403 on directories)
    location / {
        try_files $uri =404;
    }
}
