<!DOCTYPE html>
<html lang="vi" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#090d16" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>VocabFlow — Advanced English Vocabulary Learning Platform</title>
    <meta name="description" content="Nền tảng học từ vựng tiếng Anh cá nhân hóa với Spaced Repetition thích ứng và Trợ lý Gia sư AI." />
    <link rel="icon" type="image/png" sizes="256x256" href="/vocabflow-logo-256.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/vocabflow-logo-256.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      (function() {
        var t = localStorage.getItem('vocabflow_theme') || localStorage.getItem('vocabflow_theme');
        if (t === 'light') {
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 font-sans antialiased min-h-screen transition-colors duration-200">
    <div id="root">
      <div style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#090d16;z-index:9999;font-family:system-ui,-apple-system,sans-serif;">
        <div style="position:relative;width:80px;height:80px;border-radius:22px;background:rgba(15,23,42,0.9);border:1px solid rgba(255,255,255,0.12);display:flex;align-items:center;justify-content:center;box-shadow:0 0 45px rgba(99,102,241,0.3);">
          <img src="/vocabflow-logo-256.png" alt="VocabFlow" style="width:52px;height:52px;object-fit:contain;" />
        </div>
        <div style="margin-top:18px;font-weight:900;font-size:22px;letter-spacing:-0.5px;background:linear-gradient(135deg,#60a5fa,#818cf8,#38bdf8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">
          VocabFlow
        </div>
        <div style="margin-top:6px;font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:#94a3b8;">
          Spaced Repetition &amp; AI
        </div>
        <div style="margin-top:24px;width:140px;height:4px;border-radius:999px;background:rgba(255,255,255,0.08);overflow:hidden;position:relative;">
          <div style="width:50%;height:100%;border-radius:999px;background:linear-gradient(90deg,#3b82f6,#6366f1,#06b6d4);animation:vf-pulse 1.2s infinite ease-in-out;"></div>
        </div>
      </div>
      <style>
        @keyframes vf-pulse {
          0% { transform: translateX(-100%); }
          50% { transform: translateX(50%); }
          100% { transform: translateX(200%); }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
