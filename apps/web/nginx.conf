server {
    listen 80;
    server_name localhost;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype
        image/svg+xml
        image/x-icon;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Static Assets with long-term cache & immutability
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Kid Mode Assets - Never cache stale cropped images (preempts regex matching)
    location ^~ /kid/ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        try_files $uri =404;
    }

    # Images, Fonts & Favicons caching
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # Public crawler & agent text directives
    location = /robots.txt {
        default_type text/plain;
        try_files $uri =404;
    }

    location = /llms.txt {
        default_type text/plain;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # SPA Routing fallback
    location / {
        try_files $uri $uri/ /index.html;
        # HTML should not be cached aggressively to allow instant updates
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # API Proxy to Backend
    location /api/ {
        proxy_pass http://api:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
