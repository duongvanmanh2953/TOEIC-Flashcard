<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VocabFlow Kids — Trò Chơi Học Tiếng Anh Vui Nhộn Cho Bé</title>
    <meta name="description" content="Thế giới trò chơi tiếng Anh sinh động, trực quan và hấp dẫn dành cho trẻ em." />
    <link rel="icon" type="image/png" sizes="256x256" href="/vocabflow-logo-256.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/vocabflow-logo-256.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#FFFDF7] text-slate-800 font-sans antialiased min-h-screen selection:bg-amber-300">
    <div id="root">
      <div id="initial-splash" style="position:fixed;inset:0;background:linear-gradient(180deg,#FFFDF7 0%,#FFF9EB 50%,#FFF3D6 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui,-apple-system,sans-serif;z-index:9999999;user-select:none;">
        <div style="position:relative;display:flex;align-items:center;justify-content:center;margin-bottom:18px;">
          <div style="position:absolute;width:100px;height:100px;background:rgba(251,191,36,0.35);filter:blur(24px);border-radius:28px;"></div>
          <div style="position:relative;padding:14px;background:rgba(255,255,255,0.95);border:1px solid rgba(253,230,138,0.9);border-radius:24px;box-shadow:0 14px 30px rgba(245,158,11,0.18);">
            <img src="/vocabflow-logo-256.png" width="64" height="64" alt="VocabFlow Kids" style="display:block;width:64px;height:64px;object-fit:contain;" />
          </div>
        </div>
        <h1 style="color:#17345B;font-size:24px;font-weight:900;letter-spacing:-0.5px;margin:0 0 6px 0;">VocabFlow Kids</h1>
        <p style="color:#64748B;font-size:13px;font-weight:700;margin:0 0 24px 0;">Thế giới học tiếng Anh vui nhộn cùng Vivi</p>
        <div style="width:180px;height:5px;background:rgba(253,230,138,0.6);border-radius:9999px;overflow:hidden;">
          <div style="width:100%;height:100%;background:linear-gradient(90deg,#fbbf24,#f97316,#38bdf8);border-radius:9999px;animation:vfSplashKidBar 1s ease-out forwards;"></div>
        </div>
        <style>
          @keyframes vfSplashKidBar { from { transform: translateX(-100%); } to { transform: translateX(0%); } }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
