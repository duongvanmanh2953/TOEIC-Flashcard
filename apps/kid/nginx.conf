server {
    listen 80;
    server_name localhost;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype
        image/svg+xml
        image/x-icon;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Health check
    location /health {
        access_log off;
        return 200 '{"status":"UP","app":"kid"}';
        add_header Content-Type application/json;
    }

    # API Proxy to backend kid API
    location /api/ {
        proxy_pass http://kid-api:4100/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cross-App 301 Redirect: Admin Center
    location ~* ^/admin(/.*)?$ {
        rewrite ^/admin/?(.*)$ https://admin.letstun.site/$1 permanent;
    }

    # Cross-App 301 Redirect: Student Portal
    location ~* ^/(student|dashboard|review|exams|community-knowledge|word-bank)(/.*)?$ {
        return 301 https://app.letstun.site$request_uri;
    }

    # Static Media Reverse Proxy to assets container (only files with extensions)
    location ~* ^/(kid|game-assets|audio)/.*\.(png|jpg|jpeg|gif|ico|svg|webp|avif|mp3|ogg|wav|json|woff2?|ttf|eot)$ {
        proxy_pass http://assets:80;
        proxy_set_header Host assets.letstun.site;
        proxy_cache_bypass $http_upgrade;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Access-Control-Allow-Origin *;
    }

    # SPA Route for /assets and /assets/ (prevents directory trailing slash 403)
    location ~* ^/assets/?$ {
        rewrite ^ /index.html break;
    }

    # Vite Built Bundles (JS/CSS) with fallback to assets server
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri @asset_proxy;
    }

    # Fallback to assets container
    location @asset_proxy {
        proxy_pass http://assets:80;
        proxy_set_header Host assets.letstun.site;
        add_header Access-Control-Allow-Origin *;
    }

    # Images, Audio, WebP, Fonts caching with fallback
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|avif|mp3|ogg|wav|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri @asset_proxy;
    }

    # SPA Routing fallback
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
