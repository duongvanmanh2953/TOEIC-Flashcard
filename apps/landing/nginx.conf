server {
    listen 80;
    server_name vocalflow.site localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;

    # 1. Health check
    location /health {
        access_log off;
        return 200 '{"status":"UP","app":"landing"}';
        add_header Content-Type application/json;
    }

    # 2. Kid Legacy Route Redirects
    location ^~ /kids/ {
        rewrite ^/kids/(.*)$ https://kid.vocalflow.site/$1 permanent;
    }
    location = /kids {
        return 301 https://kid.vocalflow.site/;
    }
    location = /kid {
        return 301 https://kid.vocalflow.site/;
    }

    # 3. Admin Legacy Route Redirects
    location ^~ /admin/ {
        rewrite ^/admin/(.*)$ https://admin.vocalflow.site/$1 permanent;
    }
    location = /admin {
        return 301 https://admin.vocalflow.site/;
    }

    # 4. Student Legacy Route Redirects
    location ~* ^/(dashboard|languages|review|vocabulary|vocab|word-bank|my-words|community|notes|community-knowledge|exams|custom-quiz|placement-test|ai-tutor|coach|leaderboard|progress|upgrade|support|feedback|notifications|settings|login|register|forgot-password) {
        return 301 https://app.vocalflow.site$request_uri;
    }

    # 5. Asset Service Redirects
    location ^~ /game-assets/ {
        return 301 https://assets.vocalflow.site$request_uri;
    }

    # 6. Default root landing page
    location / {
        try_files $uri $uri/ /index.html;
    }
}
