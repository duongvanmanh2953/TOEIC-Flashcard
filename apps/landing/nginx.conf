server {
    listen 80;
    server_name vocalflow.site www.vocalflow.site localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;

    # 1. Health check
    location /health {
        access_log off;
        return 200 '{"status":"UP","app":"landing"}';
        add_header Content-Type application/json;
    }

    # 2. Static Asset Redirects (media, images, audio, game assets)
    location ~* ^/(game-assets|audio)/ {
        return 301 https://assets.vocalflow.site$request_uri;
    }
    location ~* ^/kid/.*\.(png|jpg|jpeg|gif|ico|svg|webp|avif|mp3|ogg|wav|json)$ {
        return 301 https://assets.vocalflow.site$request_uri;
    }
    location ~* ^/assets/.*\.(png|jpg|jpeg|gif|ico|svg|webp|avif|mp3|ogg|wav|json)$ {
        return 301 https://assets.vocalflow.site$request_uri;
    }

    # 3. Serve Local Static Assets (direct logo, favicon, fonts, css, js)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|eot|ttf|webp)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # 4. Legacy API Redirects
    location ^~ /api/ {
        return 301 https://app-api.vocalflow.site$request_uri;
    }

    # 5. Student Multiplayer Games Redirects
    location ~* ^/games/(word-match|scramble|room)(/.*)?$ {
        return 301 https://app.vocalflow.site$request_uri;
    }

    # 6. Kid Games & Kid Portal Redirects
    location ~* ^/(kids?|games)(/.*)?$ {
        return 301 https://kid.vocalflow.site$request_uri;
    }

    # 7. Admin Legacy Route Redirects
    location ~* ^/admin(/.*)?$ {
        rewrite ^/admin/?(.*)$ https://admin.vocalflow.site/$1 permanent;
    }

    # 8. Student Legacy Route Redirects
    location ~* ^/(dashboard|languages|review|vocabulary|vocab(?=/|$)|word-bank|my-words|community|notes|community-knowledge|exams|custom-quiz|placement-test|ai-tutor|coach|leaderboard|progress|upgrade|support|feedback|notifications|settings|login|register|forgot-password)(/.*)?$ {
        return 301 https://app.vocalflow.site$request_uri;
    }

    # 9. Default root landing page
    location / {
        try_files $uri $uri/ /index.html;
    }
}
